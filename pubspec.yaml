name: final_qrcode_quiz
description: A Flutter quiz app using ambient light and QR codes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.1.0

  # Ambient light sensor (reliable package)
  light: ^4.1.0

  # Blur effects
  blur: ^3.1.0

  # QR code generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.10
  image_picker: ^1.1.0
  permission_handler: ^11.3.1
  screenshot: ^3.0.0
  path_provider: ^2.1.2

  # Audio + Vibration
  audioplayers: ^5.2.1
  vibration: ^3.1.3

  # Animations
  animate_do: ^3.0.2
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/audio/quiz_bg.mp3
    - assets/images/Q2/
    - assets/images/Q4/
    - assets/animations/win.json
    - assets/animations/lose.json

